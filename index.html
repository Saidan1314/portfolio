<!doctype html>
<html lang="en" class="bg-black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0C" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <title>Adán Arteaga | Portfolio</title>
    <!-- Swapped for the visitor's language once React mounts; see LanguageProvider. -->
    <meta
      name="description"
      content="Adán Arteaga — Artificial Intelligence Engineering student at ESCOM, IPN, building Armonik, an AI automation studio."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adán Arteaga" />
    <meta property="og:title" content="Adán Arteaga | Portfolio" />
    <meta
      property="og:description"
      content="Artificial Intelligence Engineering student at ESCOM, IPN, building Armonik, an AI automation studio."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- The only two hosts the page still fetches media from. -->
    <link rel="preconnect" href="https://www.pexels.com" crossorigin />
    <link rel="preconnect" href="https://prod.spline.design" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
